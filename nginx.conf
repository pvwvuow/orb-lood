# nginx config for the docker-compose stack (see docker-compose.yml).
# The production VPS vhost is generated by deploy.sh instead.

log_format orblood_noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /var/www/orblood/public;
  index index.html;
  client_max_body_size 8m;

  # The WebSocket token travels in ?token= — keep query strings out of logs.
  access_log /var/log/nginx/access.log orblood_noargs;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

  location ~ ^/(modal-samples|notification-previews)\.html$ { return 404; }

  # HTML / JS / CSS / SW: always revalidate so new builds show up.
  location ~* \.(html|js|css|webmanifest)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(woff2?|ttf|ico|png|jpg|jpeg|gif|svg|webp)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass         http://backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass         http://backend:4000/ws;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_buffering    off;
    proxy_read_timeout 1d;
  }

  # Uploaded images (the backend adds nosniff + a sandbox CSP).
  location /uploads/ {
    proxy_pass http://backend:4000/uploads/;
    proxy_set_header Host $host;
    expires 7d;
  }
}
