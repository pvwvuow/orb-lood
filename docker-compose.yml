# Local-development stack: MySQL + backend + nginx on http://localhost:8080
#
#   cp .env.docker.example .env      # then put real random values in it
#   docker compose up -d --build
#
# Nothing is published on the network except nginx on 127.0.0.1:8080.
# Secrets have NO defaults on purpose: compose refuses to start without them.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: orblood
      MYSQL_USER: orblood
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      retries: 20

  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: orblood
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: orblood
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (64+ random hex chars)}
      HOST: 0.0.0.0
      PORT: 4000
      # nginx container is on the docker network, not loopback.
      TRUST_PROXY: uniquelocal
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /data/uploads
      PUBLIC_UPLOADS_BASE: /uploads
      # Voice / TURN (optional locally). Prefer TURN_SECRET (coturn
      # use-auth-secret); see server/.env.example.
      TURN_HOST: ${TURN_HOST:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      VOICE_FORCE_RELAY: ${VOICE_FORCE_RELAY:-false}
    volumes:
      - uploads:/data/uploads
    # Backend is only reachable through nginx (no host port).
    expose:
      - "4000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/var/www/orblood/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data: {}
  uploads: {}
