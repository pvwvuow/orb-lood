# REFERENCE ONLY — the live file is generated by scripts/setup-voice.sh
# (sudo bash scripts/setup-voice.sh). Do not copy secrets into git.
#
# coturn instance #2 (:443, the one in use)
listening-port=443
tls-listening-port=443
listening-ip=0.0.0.0
external-ip=<VPS_PUBLIC_IP>
realm=turn.orblood.ir

# TURN REST auth: the API derives short-lived per-user credentials from
# this secret (server/.env TURN_SECRET). No static user= lines.
use-auth-secret
static-auth-secret=<TURN_SECRET from /etc/orblood/secrets.env>

cert=/etc/letsencrypt/live/turn.orblood.ir/fullchain.pem
pkey=/etc/letsencrypt/live/turn.orblood.ir/privkey.pem
no-tlsv1
no-tlsv1_1

# Relay range. If BOTH instances run (KEEP_INSTANCE_1=1) they must not
# overlap: #1 = 49152-57343, #2 = 57344-65535.
min-port=49152
max-port=65535

no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Peers are the other browser's relay address on this same VPS.
allowed-peer-ip=<VPS_PUBLIC_IP>

user-quota=12
total-quota=300
stale-nonce=600
fingerprint
no-cli

log-file=/var/log/turnserver-443.log
simple-log
pidfile=/var/run/turnserver-443.pid
